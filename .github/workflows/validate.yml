---
name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      # Fix applied here: fetch-depth: 0 ensures full history & tags are available
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Sync and run tests
      - name: Run tests
        run: |
          uv sync
          uv run pytest